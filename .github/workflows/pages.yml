# Publica o app (pasta site/, gerada por tools/build.js) no GitHub Pages a cada envio para a main.
name: Publicar app
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Se uma publicação anterior travou no GitHub (estourou o tempo), cancela antes de publicar esta.
      - name: Destrava publicação presa
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10" --jq '.[].sha' | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "Cancelada: $sha" || true
          done
      - id: deploy
        uses: actions/deploy-pages@v4
