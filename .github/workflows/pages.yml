# A cada envio para a main: roda todos os testes e, só se passarem, publica o app (pasta site/) no GitHub Pages.
name: Publicar app
on:
  push:
    branches: [main]
    paths: ['site/**', 'app.html', 'tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instala o navegador de teste
        run: |
          npm i -g playwright@1.56.1
          npx -y playwright@1.56.1 install --with-deps chromium
      - name: Roda os testes
        run: NODE_PATH=$(npm root -g) bash tests/rodar-todos.sh
      - name: site/ está atualizado com o app.html
        run: |
          node -e "const a=require('fs').readFileSync('app.html','utf8'),s=require('fs').readFileSync('site/index.html','utf8');if(!s.includes(a)){console.error('site/index.html está velho: rode tools/build.js');process.exit(1)}"
  publicar:
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Se uma publicação anterior travou no GitHub (estourou o tempo), cancela antes de publicar esta.
      - name: Destrava publicação presa
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10" --jq '.[].sha' | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "Cancelada: $sha" || true
          done
      - id: deploy
        uses: actions/deploy-pages@v4
