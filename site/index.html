<title>Martins Chão de Fábrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Um só visual, claro e de alto contraste, escolhido de propósito para leitura fácil. */
:root{
  color-scheme:light;
  --bg:#EEF1F5;--card:#FFFFFF;--ink:#16202C;--ink2:#434D59;--muted:#687280;--line:#D6DCE3;
  --go:#17864A;--go-dark:#0E6A38;--go-soft:#E2F3E9;
  --atn:#E8A200;--atn-ink:#5A3E00;--atn-soft:#FFF3D1;
  --red:#C9352A;--red-soft:#FCE4E1;
  --blue:#1E5BB8;--blue-soft:#E3ECFA;
  --grey-soft:#E9ECF0;
  --font:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:19px/1.4 var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
svg.ic{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* topo */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:14px}
.ola{margin-right:auto}
.ola b{display:block;font-size:30px;line-height:1.1}
.ola span{color:var(--muted);font-size:18px}
.help{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 16px;font-weight:700}

/* navegação inferior */
main{padding-block:20px 150px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(22,32,44,.06)}
.nav .wrap{display:flex;gap:8px;padding-block:8px}.nav .nb{flex:1 1 0;min-width:0;position:relative}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;border-radius:16px;background:none;padding:10px 6px;font-weight:700;font-size:18px;color:var(--ink2)}
.nb svg.ic{width:34px;height:34px}
.nb[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.nb.novo{background:var(--go);color:#fff}
.nb-i{position:relative;display:inline-flex}.nb-i em{position:absolute;top:-6px;right:-12px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-style:normal;font-size:13px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.nb-mais{display:inline-flex}

@media (max-width:640px){.nav .wrap{gap:2px;padding-block:6px 4px}.nb.novo{background:none;color:var(--go-dark)}.nb.novo .nb-mais{width:52px;height:52px;margin-top:-22px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(20,110,60,.35);border:3px solid var(--card)}.nb.novo .nb-mais svg.ic{width:30px;height:30px}.nb.novo .nb-l{font-size:13px}.nb.novo .nb-l::before{content:'Novo';font-size:13px}.nb.novo .nb-l{font-size:0}}
.nb.novo[aria-current="page"]{background:var(--go-dark);color:#fff}

h1{font-size:30px;line-height:1.15;margin:0 0 14px;text-wrap:balance}
h2{font-size:24px;margin:0 0 10px;text-wrap:balance}

/* resumo no topo da equipe */
.resumo{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.rs{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:14px;padding:10px 16px;font-weight:700;font-size:18px}
.rs b{font-size:26px}
.dot{width:16px;height:16px;border-radius:50%;flex:none;background:currentColor}
.u-crit{background:var(--red-soft);color:var(--red)}
.u-warn{background:var(--atn-soft);color:var(--atn-ink)}
.u-ok{background:var(--go-soft);color:var(--go-dark)}
.u-pronto{background:var(--blue-soft);color:var(--blue)}
.u-fim{background:var(--grey-soft);color:var(--muted)}.u-cancel{background:#FBE9E7;color:#8A1F14}
.u-warn .dot{background:var(--atn)}

/* equipe */
.setor{margin-bottom:26px}
.setor-h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:var(--ink2);margin-bottom:10px}
.setor-h svg.ic{width:30px;height:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.pessoa{display:grid;grid-template-rows:1fr auto auto;border:2px solid var(--line);background:var(--card);border-radius:18px;overflow:hidden;min-height:190px}
.p-open{display:grid;grid-template-rows:auto 1fr;text-align:left;border:0;background:none;padding:0}
.pessoa:hover{border-color:var(--ink2)}
.p-body .emp{display:flex;align-items:center;gap:5px;color:var(--ink);font-weight:700;font-size:16px;margin-top:2px}
.p-body .emp svg.ic{width:19px;height:19px;color:var(--muted)}
.p-body .prox{display:block;color:var(--atn-ink);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.p-act{display:flex;align-items:center;justify-content:center;gap:10px;border:0;margin:0 12px 12px;border-radius:14px;min-height:58px;font-size:21px;font-weight:700;color:#fff}
.p-act svg.ic{width:28px;height:28px;stroke-width:3.8}
.p-act.ini{background:var(--blue)}.p-act.ini:hover{background:#174A96}
.p-act.fim{background:var(--go)}.p-act.fim:hover{background:var(--go-dark)}
.st-trab .p-st,.st-livre .p-st,.st-nada .p-st{margin-bottom:12px}
.p-top{display:flex;align-items:center;gap:12px;padding:14px 14px 8px}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;flex:none}
.p-top b{display:block;font-size:22px;line-height:1.1}
.p-top small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:16px}
.p-top small svg.ic{width:20px;height:20px}
.p-body{display:flex;align-items:center;gap:12px;padding:4px 14px 12px}
.p-body svg.prod{width:64px;height:64px;flex:none}
.p-body b{display:block;font-size:19px;line-height:1.2}
.p-body span{color:var(--ink2);font-size:17px}
.p-body .vazio{color:var(--muted);font-size:17px}
.p-st{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;font-size:17px}
.st-trab .p-st{background:var(--go-soft);color:var(--go-dark)}
.st-livre{border-color:var(--atn)}
.st-livre .p-st{background:var(--atn);color:#2B1D00}
.st-livre .p-st .dot{background:#2B1D00}
.st-nada .p-st{background:var(--grey-soft);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.st-livre .p-st .dot{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(.55);opacity:.5}}

/* pedidos */
.peds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.ped{display:grid;gap:10px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:0 0 16px;overflow:hidden}
.ped:hover{border-color:var(--ink2)}
.ped-st{display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.ped h3{margin:0;padding-inline:16px;font-size:24px;line-height:1.15}
.ped-ent{display:flex;align-items:center;gap:8px;padding-inline:16px;color:var(--ink2);font-size:18px}.ped-ent>span{min-width:0;flex:1}.nw{white-space:nowrap}
.ped-prods{display:flex;flex-wrap:wrap;gap:12px;padding-inline:16px}
.pp{display:grid;justify-items:center;gap:4px;width:92px}
.pp svg.prod{width:72px;height:72px}
.pp b{font-size:18px}
.barra{height:10px;width:100%;border-radius:5px;background:var(--grey-soft);overflow:hidden}
.barra i{display:block;height:100%;background:var(--go);border-radius:0 5px 5px 0}
.falta{margin-inline:16px;display:flex;align-items:center;gap:8px;background:var(--atn-soft);color:var(--atn-ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:17px}

/* telas cheias (folhas) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{max-width:780px;padding-block:14px}
.sheet.largo .wrap{max-width:1180px}
@media (max-width:560px){.nb{font-size:15px}.nb svg.ic{width:28px;height:28px}}
/* mapa de etapas */
.fx-wrap{overflow-x:auto;padding:8px 4px 14px;margin-top:10px;-webkit-overflow-scrolling:touch}
.fx{position:relative}
.fx-lines{position:absolute;left:0;top:0;overflow:visible}
.fx-lines path.e{fill:none;stroke:#A9B3BF;stroke-width:2.5}
.fx-lines path.e.on{stroke:var(--go)}
.fx-lines path.e.hi{stroke:var(--blue);stroke-width:4}
.fx-lines path.e.dim{opacity:.12}
.nd{position:absolute;display:flex;flex-direction:column;gap:2px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px;overflow:hidden}
.nd:hover{border-color:var(--ink2)}
.nd-h{display:flex;gap:6px;align-items:flex-start;font-size:16px;line-height:1.15;font-weight:700}
.nd-h svg.ic{width:22px;height:22px}
.nd-m{font-size:14px;color:var(--muted);padding-left:28px}
.nd-s{font-size:14px;font-weight:700;margin-top:auto;display:flex;gap:5px;align-items:center;line-height:1.15}
.nd-s svg.ic{width:18px;height:18px}
.nd.st-ok{background:var(--go-soft);border-color:var(--go)}.nd.st-ok .nd-s{color:var(--go-dark)}
.nd.st-and{background:var(--blue-soft);border:3px solid var(--blue)}.nd.st-and .nd-s{color:var(--blue)}
.nd.st-ready{border:3px solid var(--ink)}.nd.st-ready .nd-s{color:var(--ink)}
.nd.st-pend{background:#F5F6F8;border-style:dashed}.nd.st-pend .nd-s{color:var(--muted);font-weight:400}
.nd.f-pers{background:var(--atn-soft);border-color:var(--atn)}
.nd.f-antes .nd-s{color:var(--go-dark)}
.nd.f-depois .nd-s{color:var(--ink2);font-weight:400}
.nd.dim{opacity:.25}
.nd.virt{border-radius:22px}
.nd.sel{box-shadow:0 0 0 4px var(--blue)}
.fx-info{display:grid;gap:10px;background:var(--blue-soft);border-radius:16px;padding:16px;margin-top:4px;font-size:18px}
.fx-info .t{display:flex;align-items:center;gap:8px;font-size:23px;font-weight:700}
.fx-info .t svg.ic{width:30px;height:30px}
.fx-info .lin{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagp{background:var(--card);border-radius:10px;padding:3px 10px;font-weight:700;font-size:16px;border:2px solid var(--line)}
.arraste{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:16px}
.legenda{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:16px;color:var(--ink2);margin:6px 0 2px}
.legenda span{display:inline-flex;align-items:center;gap:7px}
.legenda i{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:inline-block;background:var(--card)}
.prodbloco{padding:16px 0;border-top:2px solid var(--grey-soft)}
.prodbloco:first-of-type{border-top:0;padding-top:4px}
.prodbloco .prodline{border-top:0;padding:0}
/* produtos */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.prodc{display:grid;justify-items:center;gap:6px;text-align:center;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:18px}
.prodc:hover{border-color:var(--ink2)}
.prodc svg.prod{width:130px;height:130px}
.prodc b{font-size:22px}
.prodc span{color:var(--ink2);font-size:17px}
.prodc.add{border-style:dashed;color:var(--go-dark);align-content:center}
.prodc.add svg.ic{width:64px;height:64px}
.linha-dep{display:flex;flex-wrap:wrap;gap:8px}
.depc{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700;font-size:17px}
.depc svg.ic{width:22px;height:22px}
.depc[aria-pressed="true"]{border-color:var(--go);background:var(--go-soft);color:var(--go-dark)}
.rotulo{color:var(--ink2);font-weight:700;font-size:19px;margin:22px 0 8px}
.x.azul{color:var(--blue)}
.voltar{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 20px 12px 14px;font-weight:700;font-size:20px;margin-bottom:18px}
.voltar svg.ic{width:28px;height:28px}
.quem{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.quem .av{width:64px;height:64px;font-size:30px}
.quem b{display:block;font-size:30px;line-height:1.1}
.quem div span{color:var(--muted);font-size:19px}
.tarefa{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center}
.tarefa.sug{border-color:var(--ink)}
.tarefa svg.prod{width:150px;height:150px}
.tarefa .etapa{font-size:36px;font-weight:700;line-height:1.05;text-transform:uppercase}
.tarefa .qtd{font-size:26px;font-weight:700;margin-top:6px}
.tarefa .desc{color:var(--ink2);font-size:19px}
.tarefa .para{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
@media (max-width:560px){.tarefa{grid-template-columns:1fr;justify-items:start}.tarefa svg.prod{width:110px;height:110px}.tarefa .etapa{font-size:30px}}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 13px;font-weight:700;font-size:16px}
.pill svg.ic{width:20px;height:20px}
.pill.adi{background:var(--blue-soft);color:var(--blue)}
.pill.cons{background:var(--red-soft);color:var(--red)}
.instr{display:flex;gap:12px;align-items:flex-start;background:var(--atn-soft);border:2px solid var(--atn);color:var(--atn-ink);border-radius:16px;padding:14px 16px;font-size:20px;font-weight:700;margin-top:14px}
.instr svg.ic{width:32px;height:32px}
.acoes{display:grid;gap:12px;margin-top:20px}
.big{display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:18px;min-height:78px;padding:14px 22px;font-size:26px;font-weight:700}
.big svg.ic{width:36px;height:36px;stroke-width:3.6}
.big.go{background:var(--go);color:#fff}
.big.go:hover{background:var(--go-dark)}
.big.prob{background:var(--card);color:var(--red);border:3px solid var(--red);min-height:66px;font-size:22px}
.big.neutro{background:var(--card);color:var(--ink2);border:2px solid var(--line);min-height:62px;font-size:21px}
.big.azul{background:var(--blue);color:#fff}
.big.go.ini{background:var(--blue)}
.big:disabled{opacity:.4;cursor:not-allowed}
.outras{display:grid;gap:10px;margin-top:10px}
.outra{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 14px}
.outra svg.prod{width:64px;height:64px}
.outra b{display:block;font-size:20px}
.outra span{color:var(--ink2);font-size:17px}
.outra .ir{font-weight:700;color:var(--go-dark);display:flex;align-items:center;gap:4px}
.feito{display:grid;justify-items:center;text-align:center;gap:8px;padding:10px 0 20px}
.feito .ok{width:110px;height:110px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center}
.feito .ok svg.ic{width:66px;height:66px;stroke-width:4.5}
@media (prefers-reduced-motion:no-preference){.feito .ok{animation:pop .35s ease-out}}
@keyframes pop{from{transform:scale(.6);opacity:.3}}
.feito b{font-size:30px}
.feito span{font-size:20px;color:var(--ink2)}
.vazio-box{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:26px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--ink2);font-size:20px}
.vazio-box svg.ic{width:60px;height:60px;color:var(--muted)}

/* pedido detalhe */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.ped-head{display:grid;gap:8px}
.ped-head h1{margin:0}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chk{display:grid;justify-items:center;gap:8px;text-align:center;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:16px 10px;font-weight:700;font-size:19px}
.chk svg.ic{width:44px;height:44px}
.chk .box{width:34px;height:34px;border-radius:9px;border:3px solid var(--muted);display:grid;place-items:center}
.chk .box svg.ic{width:24px;height:24px;stroke-width:4.5;visibility:hidden}
.chk[aria-pressed="true"]{border-color:var(--go);background:var(--go-soft);color:var(--go-dark)}
.chk[aria-pressed="true"] .box{background:var(--go);border-color:var(--go);color:#fff}
.chk[aria-pressed="true"] .box svg.ic{visibility:visible}
.mat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:2px solid var(--grey-soft)}
.mat svg.ic{width:34px;height:34px;color:var(--atn-ink)}
.mat b{display:block;font-size:19px}
.mat span{color:var(--ink2);font-size:17px}
.mbtn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:18px;background:var(--blue);color:#fff}
.lib{display:flex;align-items:center;gap:12px;border-radius:16px;padding:14px 16px;font-weight:700;font-size:21px;margin-top:14px}
.lib svg.ic{width:34px;height:34px}
.prodline{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center;padding:14px 0;border-top:2px solid var(--grey-soft)}
.prodline:first-of-type{border-top:0}
.prodline svg.prod{width:110px;height:110px}
.prodline h3{margin:0;font-size:22px}
.prodline .agora{font-size:18px;color:var(--ink2);margin-top:4px}
.trilha{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tp{display:grid;justify-items:center;gap:4px;width:112px;text-align:center;font-size:15px;font-weight:700;color:var(--muted)}
.tc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);background:var(--card)}
.tc svg.ic{width:28px;height:28px}
.tp.ok{color:var(--go-dark)}.tp.ok .tc{background:var(--go);border-color:var(--go);color:#fff}
.tp.and{color:var(--blue)}.tp.and .tc{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.tp small{font-weight:400;font-size:14px;color:var(--ink2)}
@media (max-width:560px){.prodline{grid-template-columns:1fr}.tp{width:70px}}

/* novo pedido */
.passos{display:flex;gap:8px;margin-bottom:18px}
.passos i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.passos i.on{background:var(--go)}
.passo-n{color:var(--muted);font-weight:700;font-size:18px;margin-bottom:4px}
.campo{width:100%;font:inherit;font-size:26px;padding:16px 18px;border:3px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
.campo:focus{border-color:var(--blue);outline:none}
.escolhe{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}

const fmtCnpj=v=>{const d=soDig(v).slice(0,14);return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2')};
const PF_ST=[['todos','Todos'],['crit','Atrasando'],['warn','Atenção'],['ok','Em dia'],['pronto','Prontos'],['fim','Entregues'],['cancel','Cancelados']];
const PF_ORD=[['urg','Mais urgente'],['entrega','Data de entrega'],['emissao','Data do pedido']];
function listaPedidos(){const f=ui.pf||{},q=(f.q||'').trim().toLowerCase(),qd=soDig(q);
  let ls=state.pedidos.map(p=>({p,i:info(p)}));
  if(f.st&&f.st!=='todos')ls=ls.filter(x=>x.i.u===f.st);
  if(q)ls=ls.filter(({p})=>(p.cliente||'').toLowerCase().includes(q)||(p.contato||'').toLowerCase().includes(q)||(qd.length>=2&&soDig(p.cnpj).includes(qd))||p.id.includes(q)||String(p.ficha||'').includes(q));
  const dir=f.inv?-1:1,o=f.ord||'urg';
  ls.sort((a,b)=>dir*(o==='entrega'?a.p.entrega-b.p.entrega:o==='emissao'?b.p.chegada-a.p.chegada:a.i.score-b.i.score));
  if(!ls.length)return `<div class="vazio-box">${ic('i-lupa')}<b>Nenhum pedido encontrado</b><span>Mude o filtro ou a busca.</span></div>`;
  return `<div class="peds">${ls.map(({p,i})=>{const falta=[];if(!p.vias)falta.push('vias');if(!p.arte)falta.push('arte');if(p.materiais.some(m=>m.st==='comprar'||m.st==='pedido'))falta.push('material');
    const fora=i.ls.some(loteFora);
    return `<button class="ped" data-a="pedido" data-id="${p.id}"><div class="ped-st u-${i.u}"><span class="dot"></span>${ULAB[i.u]}</div>
      <h3>${esc(p.cliente)}</h3>${p.contato||p.cnpj?`<div class="ped-ent" style="font-size:16px;color:var(--muted)">${esc(p.contato)}${p.contato&&p.cnpj?' · ':''}${p.cnpj?`<span style="white-space:nowrap">CNPJ ${esc(p.cnpj)}</span>`:''}</div>`:''}
      <div class="ped-ent">${ic('i-caminhao')}${entregaTxt(p,i)}</div><div class="ped-ent" style="font-size:16px;color:var(--muted)">Pedido ${esc(p.id)} · feito em ${fD(p.chegada)}</div>
      <div class="ped-prods">${i.ls.filter(l=>!l.rework).map(l=>{const[d,t]=minsTot(l);return `<div class="pp">${loteSvg(l)}<b>${l.qtd}</b><div class="barra"><i style="width:${d/t*100}%"></i></div></div>`}).join('')}</div>
      ${falta.length&&!p.concluido?`<div class="falta">${ic('i-cadeado')}Falta: ${falta.join(', ')}</div>`:''}
      ${fora&&!p.concluido?`<div class="falta" style="background:#F3ECFB;color:#6B2F8C">${ic('i-caminhao')}Parte da peça no fornecedor</div>`:''}
    </button>`}).join('')}</div>`}

  const stN=(PF_ST.find(x=>x[0]===f.st)||PF_ST[0])[1],ordN=(PF_ORD.find(x=>x[0]===f.ord)||PF_ORD[0])[1];

function sCli(){const e=ui.sheet,c=cliById(e.id);if(!c)return voltar();const ps=pedsDoCli(c.id).sort((a,b)=>(a.concluido?1:0)-(b.concluido?1:0)||b.chegada-a.chegada);

const ETAPAS=[{nome:'Corte',i:'i-corte',g:['corte']},{nome:'Personalização',i:'i-estampa',g:['pers']},{nome:'Costura',i:'i-maquina',g:['costura']},{nome:'Arremate',i:'i-lupa',t:['arremate']},{nome:'Embalar',i:'i-caixa',t:['embalagem']}];
function prodLine(l,ped){const p=rp(l);
  const et=ETAPAS.map(e=>{const ss=p.steps.filter(s=>e.t?e.t.includes(s.posto):e.g.includes(tipo(s.posto).grupo));if(!ss.length)return '';const n=ss.filter(s=>done(l,s.id)).length,and=ss.some(s=>stOf(l,s.id).st==='and'),fo=ss.some(s=>stOf(l,s.id).st==='fora');

const NW=200,NH=104,GX=48,GY=14;
function layout(p){const L=lv(p),cols=[],row={};topo(p).forEach(s=>(cols[L[s.id]]=cols[L[s.id]]||[]).push(s));
  const bar=s=>s.deps.length?sum(s.deps.map(d=>row[d]||0))/s.deps.length:0;
  cols.forEach((c,i)=>{if(i)c.sort((a,b)=>bar(a)-bar(b));c.forEach((s,r)=>row[s.id]=r)});
  const maxR=Math.max(1,...cols.map(c=>c.length)),pos={};
  cols.forEach((c,i)=>{const off=(maxR-c.length)*(NH+GY)/2;c.forEach((s,r)=>pos[s.id]={x:i*(NW+GX),y:off+r*(NH+GY)})});
  return{pos,w:Math.max(NW,cols.length*(NW+GX)-GX),h:maxR*(NH+GY)-GY}}
function ndStatus(l,s,ped){const x=stOf(l,s.id),m=sMap(rp(l));
  if(x.st==='ok')return['ok',`${ic('i-check')}${x.herdado?'Já estava feito':'Feito'+(x.op?' · '+esc(pNome(x.op)):'')}`];
  if(x.st==='and'){if(x.partes){const r=x.partes.filter(p=>p.st==='and');return['and',`${ic('i-mao')}${r.map(p=>esc(pNome(p.op))).join(' e ')} · ${pecasFeitas(x)} de ${qtdEf(l)} prontas`]}return['and',`${ic('i-mao')}${esc(pNome(x.op))} · ${esc(unidade(x.maq)?.nome||'')}`]}
  if(x.st==='pend'&&x.partes&&ready(l,s,ped))return['ready',`${ic('i-seta')}Pausado · faltam ${restante(l,s.id)}`];
  if(x.st==='fora'){const d=diasDesde(x.saiu);return['fora',`${ic('i-caminhao')}No fornecedor ${haQuanto(x.saiu)}`]}
  if(ready(l,s,ped))return['ready',`${ic('i-seta')}${isExt(s)?'Pronta para levar':'Pode começar'}`];
  const f=s.deps.filter(d=>!done(l,d));
  if(!f.length&&s.pers&&!arteOk(ped,l,s))return['pend','Espera enviar a arte'];
  if(!f.length&&isExt(s))return['pend',`Espera ${s.partes.join(', ').toLowerCase()} sair da máquina`];
  const fo=f.find(d=>stOf(l,d).st==='fora');if(fo)return['pend',`${ic('i-caminhao')}Espera ${m[fo].partes.join(', ').toLowerCase()} voltar`];
  return['pend',f.length?`Espera: ${esc(m[f[0]].nome)}${f.length>1?` e mais ${f.length-1}`:''}`:'Espera liberar o corte']}
function rotaV(l,ped){const R=rp(l);if(l.rework)return R;const c0=R.steps[0];
  const V=(id,nome,icon,deps,f)=>({id,nome,posto:'_esc',deps,min:0,virt:true,icon,f,partes:[]});
  const vs=[V('v_vias','Separar vias','i-vias',[],'vias'),V('v_prep','Preparar arte','i-arte',[],'arte_prep'),V('v_aprov','Aprovar arte','i-arte',['v_prep'],'arte_aprov'),V('v_mat','Material','i-carrinho',[],'comprar')];
  const envs=R.steps.filter(z=>z.pers).map(z=>V('v_env_'+z.id,'Enviar arte','i-arte',['v_aprov'],'arte_env'));
  const fim=R.steps.filter(z=>!R.steps.some(x=>x.deps.includes(z.id))).map(z=>z.id);
  const steps=R.steps.map(z=>z===c0?{...z,deps:[...z.deps,'v_vias','v_aprov','v_mat']}:z.pers?{...z,deps:[...z.deps,'v_env_'+z.id]}:z);
  return{...R,steps:[...vs,...envs,...steps,V('v_ent','Entregar ao cliente','i-caminhao',fim,'entregar')]}}
function vDone(l,ped,id){if(id==='v_vias')return!!ped.vias;if(id==='v_prep')return!!ped.artePrep;if(id==='v_aprov')return!!ped.arte;
  if(id==='v_mat')return ped.materiais.every(m=>m.st==='ok'||m.st==='recebido');if(id==='v_ent')return!!ped.concluido;
  if(id.startsWith('v_env_'))return arteOk(ped,l,{id:id.slice(6)});return done(l,id)}
const feitoN=(l,ped,id)=>id.startsWith('v_')?vDone(l,ped,id):done(l,id);
function vTask(l,ped,s){const a={v_vias:'vias',v_prep:'artePrep',v_aprov:'arte',v_ent:'entregar'}[s.id];

function vStatus(l,ped,s,R){if(vDone(l,ped,s.id))return['ok',`${ic('i-check')}Feito`];const t=vTask(l,ped,s);

function fluxo(p,key,l,ped){const{pos,w,h}=layout(p),m=sMap(p);const sel=ui.fx&&ui.fx.k===key&&m[ui.fx.s]?ui.fx.s:null;

  const mark=(id,c)=>`<marker id="${id}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;

{c:'rua',q:'Onde vejo o que está no prestador de serviço (na rua)?',k:'na rua fora terceirizado prestador bordado dtf fornecedor peças fora',r:['Na Fábrica, toque na aba Fora.','Cada prestador mostra o que está lá, há quanto tempo, e avisa se passou do prazo.'],ir:'fab:fora'},
{c:'rua',q:'Levei peças para o prestador. Como registro?',k:'levei levar entregar no fornecedor terceirizado saiu',r:['Na Fábrica, aba Escritório, setor Logística: tarefa "Levar para …".','Toque em Levei.','As peças passam a aparecer na aba Fora.'],ir:'fab:esc'},
{c:'rua',q:'As peças voltaram do prestador. Como registro?',k:'voltou chegou buscar buscou retorno fornecedor',r:['Na Fábrica, aba Fora (ou Escritório › Logística), ache o item.','Toque em Chegou. As peças voltam para a produção.'],ir:'fab:fora'},
{c:'rua',q:'Como cadastro um prestador de serviço novo?',k:'cadastrar fornecedor prestador terceirizado novo bordadeira',r:['Cadastros › Terceirizados.','Toque em Adicionar fornecedor de … (no serviço certo).','Escreva o nome, o prazo em dias e quem costuma levar e buscar. Toque em Salvar.'],ir:'cad:forn',g:1},
{c:'rua',q:'Como mudo o prazo de um prestador?',k:'prazo fornecedor dias atraso',r:['Cadastros › Terceirizados.','Toque no fornecedor, ajuste o Prazo (dias) e toque em Salvar.'],ir:'cad:forn',g:1},
/* escritório */
{c:'esc',q:'Onde vejo as tarefas do escritório?',k:'tarefas escritório pendências fazer lista afazeres',r:['Na Fábrica, toque na aba Escritório.','As tarefas ficam por setor: Pedidos, Artes, Lista de compras e Logística.','Cada tarefa mostra o pedido, quem faz e o botão para marcar.'],ir:'fab:esc'},
{c:'esc',q:'Como passo uma tarefa para outra pessoa?',k:'trocar pessoa responsável atribuir passar tarefa quem faz',r:['Na aba Escritório, toque na foto de quem faz, embaixo da tarefa.','Toque em quem vai fazer.','Para voltar ao automático: Deixar o sistema escolher.'],ir:'fab:esc'},
{c:'esc',q:'Como deixo um setor sempre com a mesma pessoa?',k:'responsável fixo setor sempre dono automático roger compras',r:['Na aba Escritório, toque no botão redondo no canto do setor (foto ou bonequinhos).','Para cada tipo de tarefa, toque na pessoa (ou Automático, para o sistema dividir).'],ir:'fab:esc'},
{c:'esc',q:'Alguém saiu (médico, rua). Como tiro as tarefas dela?',k:'pessoa saiu fora ausente faltou redistribuir',r:['No fim da aba Escritório, em "No escritório agora", toque no nome da pessoa.','Ela fica "fora" e as tarefas vão para outras pessoas. Toque de novo quando voltar.'],ir:'fab:esc'},
{c:'esc',q:'Como marco que as fichas e os mockups (vias) foram separados?',k:'vias separar fichas mockups separei',r:['Escritório › Pedidos: tarefa "Separar as vias" → toque em Separei.','Ou abra o pedido e toque em Vias separadas, em "Antes de cortar".'],ir:'fab:esc'},
{c:'esc',q:'Como confiro os tecidos e aviamentos (insumos) de um pedido?',k:'conferir insumos tecidos aviamentos estoque material conferência',r:['Escritório › Lista de compras: "Conferir insumos" → toque em Conferir (ou abra o pedido e toque em Insumos conferidos).','Vá até o estoque e, em cada item, toque em Tem ou Falta.','No Falta, escreva quanto falta, escolha a unidade (unidade, metro ou Kg) e toque em Pôr na lista de compras.','A lista de compras mostra exatamente o que falta.','Ao lado de cada quantidade aparece para quantas peças ela é (ex.: ≈ 14 metros para 15 Blusa de Agasalho). Assim dá para conferir a conta sem abrir a ficha.','Ao tocar em Falta, aparece também quanto dá por peça (ex.: ≈ 0,93 m por peça), para ver se a quantidade está dentro do normal.']},
{c:'esc',q:'Faltou um item na conferência. Como acrescento?',k:'faltou item acrescentar incluir zíper entretela botão conferência insumo novo',r:['Abra a conferência (Conferir insumos).','Em "Faltou algum item na lista?", escreva o nome, a quantidade e a unidade.','Toque em Pôr. Depois toque em Tem ou Falta nele.']},
{c:'esc',q:'Comprei o material. Como registro?',k:'comprei compra comprar material tecido aviamento lista de compras',r:['Escritório › Lista de compras: "Comprar …" → toque em Comprei.','Quando chegar: "Receber …" → toque em Chegou.'],ir:'fab:esc'},
{c:'esc',q:'Como entrego o pedido ao cliente?',k:'entregar entregue finalizar pedido concluir cliente',r:['Quando tudo estiver pronto aparece a tarefa "Entregar ao cliente" (Escritório › Logística) e um botão grande no pedido.','Toque em Entregue. O pedido sai da lista de abertos.','Errou? Toque em Desfazer logo em seguida.'],ir:'fab:esc'},
{c:'esc',q:'O que quer dizer "Chamar app para levar"?',k:'chamar app uber motoboy aplicativo entrega',r:['A pessoa responsável faz levar e buscar chamando um aplicativo de entrega.','Isso se marca no cadastro da pessoa: "Leva e entrega chamando aplicativo".']},
/* pedidos */
{c:'ped',q:'Como acho um pedido?',k:'achar buscar procurar pesquisar pedido cliente empresa cnpj número',r:['Toque em Pedidos, na barra de baixo.','Escreva na busca o nome da empresa, do cliente, o CNPJ ou o número.'],ir:'ped'},
{c:'ped',q:'Como vejo só os atrasados (ou só os entregues)?',k:'filtrar filtro atrasados atrasando atenção em dia prontos entregues cancelados',r:['Em Pedidos, toque em Filtrar.','Toque na situação que quer ver. Para ver tudo de novo: Todos.'],ir:'ped'},
{c:'ped',q:'Como mudo a ordem da lista de pedidos?',k:'ordenar ordem data entrega urgente mais antigo recente',r:['Em Pedidos, toque em Ordenar.','Escolha Mais urgente, Data de entrega ou Data do pedido.','Tocar de novo na mesma opção inverte a ordem.'],ir:'ped'},
{c:'ped',q:'O que quer dizer Atrasando, Atenção, Em dia?',k:'atrasando atenção em dia pronto entregue situação cor vermelho amarelo verde',r:['Atrasando (vermelho): pelo trabalho que falta, não dá tempo até a entrega.','Atenção (amarelo): dá, mas está apertado.','Em dia (verde): tudo certo.','Pronto: tudo feito, falta entregar. Entregue: já foi. Cancelado: o cliente desistiu (fica guardado, fora da produção).']},
{c:'ped',q:'O que precisa para liberar o corte?',k:'pode cortar liberar produção antes de cortar corte bloqueado',r:['Abra o pedido. Em "Antes de cortar" precisa estar tudo marcado: Vias separadas, Arte preparada, Arte aprovada, Insumos conferidos e Material.','Quando tudo estiver ok aparece "Pode cortar".']},
{c:'ped',q:'Como vejo em que processo cada peça está?',k:'andamento processo etapa onde está peça acompanhar mapa',r:['Abra o pedido e desça até "Peças e etapas".','Cada peça mostra o que já foi feito e o que falta. Toque numa etapa do mapa para ver os detalhes.'],ir:'ped'},
{c:'ped',q:'Onde vejo todos os pedidos de uma empresa?',k:'empresa cliente pedidos da empresa histórico',r:['Em Pedidos, toque na chave Empresas (ícone de prédio).','Toque na empresa.'],ir:'emp'},
{c:'ped',q:'Como corrijo o nome, CNPJ ou contato de uma empresa?',k:'corrigir empresa dados cnpj contato nome cliente',r:['Pedidos › Empresas › toque na empresa.','Mude os dados e toque em Salvar.'],ir:'emp'},
{c:'ped',q:'Como cancelo um pedido?',k:'cancelar cancelamento desistiu desistência cliente desistiu parar pedido anular',r:['Abra o pedido e toque em Cancelar pedido (no fim do primeiro quadro).','Se quiser, escreva o motivo. Toque em Sim, cancelar pedido.','O pedido sai da produção, das máquinas e das tarefas. O que estava rodando para, e o tempo já trabalhado fica registrado.','Ele continua guardado em Pedidos › Filtrar › Cancelados.'],ir:'ped'},
{c:'ped',q:'Cancelei sem querer. Como volto o pedido?',k:'voltar reativar desfazer cancelamento cancelado engano descancelar',r:['Logo depois, toque em Desfazer na mensagem escura.','Se já passou: Pedidos › Filtrar › Cancelados, abra o pedido e toque em Voltar o pedido para a produção.','O que estava rodando volta para a fila.'],ir:'ped'},
{c:'ped',q:'Dá para apagar um pedido?',k:'apagar excluir deletar pedido remover',r:['Um pedido real não se apaga. Se o cliente desistiu, use Cancelar pedido: ele sai da produção e fica guardado em Cancelados.','Se foi lançado errado, use Corrigir pedido.','Só os pedidos de exemplo podem ser apagados (Cadastros › Ajustes › Pedidos de exemplo).']},
/* novo e corrigir */
{c:'novo',q:'Como lanço um pedido novo?',k:'novo pedido lançar cadastrar criar pedido venda',r:['Toque no + Novo, na barra de baixo.','Passo 1: empresa, contato, CNPJ e quem vendeu.','Passo 2: em Adicionar peça, escolha a peça na lista. Depois escolha tecido e cor nas listas, a personalização e as quantidades por tamanho.','Passo 3: a data de entrega. Passo 4: confira e toque em Criar pedido.'],ir:'novo'},
{c:'novo',q:'Como importo a ficha de produção em PDF?',k:'importar ficha pdf ler ficha automático mockup junto',r:['Toque no + Novo e depois em Importar fichas.','Escolha as fichas (PDF ou Word) e, se quiser, os mockups junto. Pode escolher vários arquivos de uma vez.','Tudo o que você escolher de uma vez vira um pedido só, mesmo que as fichas tenham números diferentes.','O sistema lê empresa, número, produto, modelo (capuz, bolso canguru…), tecido, cor, outras cores e onde vão, personalização (também abreviada, como "Bord"), tamanhos, prazo e observações. O mockup vai sozinho para a peça cuja cor ou produto está no nome do arquivo.','Confira o que tem o sinal ⚠, escolha quem vendeu e toque em Criar pedido.'],ir:'novo'},
{c:'ped',q:'Como separo peça masculina e feminina?',k:'feminina feminino masculina masculino modelagem baby look babylook separar mulher homem',r:['No novo pedido, cada peça pergunta: Masculina ou feminina?','Se o pedido tem as duas, adicione a peça duas vezes: uma masculina e outra feminina, cada uma com seus tamanhos.','A ficha de produção mostra MASCULINA ou FEMININA em destaque, para a costura não confundir.','Na importação da ficha, o sistema já marca sozinho quando está escrito feminina ou masculina.'],ir:'ped'},
{c:'cad',q:'Onde marco cobre gola e segunda barra da polo?',k:'cobre gola segunda barra peitilho polo detalhe cor secundária punho manga gola',r:['Na polo, a cor do detalhe vai no peitilho, no cobre gola e na segunda barra da manga.','No novo pedido, em Outras cores na peça, escolha a cor e toque nessas partes.','Na importação, quando a ficha da polo diz “gola” ou “manga” no detalhe, o sistema já entende como cobre gola e segunda barra.'],ir:'ped'},
{c:'cad',q:'Como cadastro variações como manga longa e manga curta?',k:'variação variações manga longa manga curta modelo versão produto camisa social',r:['Vá em Cadastros › Produtos e abra o produto.','No quadro Variações, escreva a variação (ex.: Manga longa) e toque em Adicionar.','No novo pedido, cada peça desse produto escolhe a variação. Ela aparece no pedido e na ficha de produção.'],ir:'cad:produtos'},
{c:'cad',q:'Posso fazer qualquer peça em qualquer tecido?',k:'qualquer tecido tecidos lista geral tecido novo cadastrar tecido malha piquet',r:['Sim. No pedido, o tecido sai de uma lista geral, com todos os tecidos cadastrados.','Para cadastrar um tecido novo: no pedido, escolha Novo tecido na lista. Ou vá em Cadastros › Ajustes › Tecidos.','O mesmo tecido não entra duas vezes, mesmo escrito com letras diferentes.'],ir:'cad:ajustes#Tecidos'},
{c:'ped',q:'Como imprimo as etiquetas do corte?',k:'etiqueta etiquetas térmica impressora corte cortador paninho escrever pacote personalização qr code adesivo',r:['Abra o pedido e toque em Etiquetas, ao lado de PDF de produção.','Saem dois tipos, em 10 × 8 cm: uma de pacote para cada peça (vai com ela para a costura) e uma de personalização para cada parte que sai para bordar, estampar ou aplicar DTF.','Toque em Imprimir (impressora térmica) ou em Baixar PDF.','O QR code de cada etiqueta abre a ficha de produção daquela peça em qualquer celular, sem precisar entrar no app. Só mostra aquela ficha: o resto do sistema continua fechado.'],ir:'ped'},
{c:'esc',q:'Dá para cortar pedidos juntos?',k:'cortar junto corte junto mesmo tecido mesma cor enfesto aproveitar outras fichas pretas juntar corte',r:['Sim. Na tarefa de Corte aparece o quadro Dá para cortar junto.','Ele mostra as peças de outros pedidos com o mesmo tecido e a mesma cor que ainda não foram cortadas, mesmo que o modelo seja outro (ex.: Polo Viena e Polo Amsterdã) e mesmo que a entrega seja mais para frente.','Cada uma diz se já está liberada para cortar. Toque nela para abrir o pedido. Quem decide se corta junto é a equipe.'],ir:'ped'},
{c:'gestor',q:'Como vejo quanto tempo os pedidos ficam em cada etapa?',k:'ciclo gargalo tempo médio etapa fase demora quanto tempo produção eficiência despacho insumos corte personalização costura embalagem',r:['Painel do gestor › Ciclo.','Mostra o tempo médio, em dias úteis, de cada fase: despacho para produção, insumos e compras, corte, personalização, costura e embalagem. A maior barra é o gargalo.','Embaixo, pedido por pedido: toque em um para ver quando cada fase começou e terminou.'],ir:'gest:ciclo'},
{c:'rua',q:'Como escolho para onde vai a estampa ou o bordado?',k:'escolher fornecedor onde vai estampa interno aqui na fábrica rafael terceirizado mudar fornecedor bordado márcio junior',r:['Abra o pedido, toque na peça e depois na etapa da personalização (ex.: Estampa centro da frente).','Em Onde vai ser feito?, escolha o fornecedor ou Aqui na fábrica.','A tarefa de levar e buscar passa a ser para quem você escolheu.'],ir:'ped'},
{c:'rua',q:'Marquei Levei sem querer. Como desfaço?',k:'desfazer levei sem querer errado voltar não levou mandei errado fornecedor rafael interno',r:['Abra o pedido, toque na peça e depois na etapa da personalização.','Toque em Desfazer: as peças não foram levadas. A tarefa Levar volta a aparecer.','Se era para fazer aqui dentro, escolha Aqui na fábrica em Onde vai ser feito?.'],ir:'ped'},
{c:'cad',q:'Onde mudo o nome de um tecido ou tiro um tecido?',k:'tecido cadastro de tecidos mudar nome renomear tirar apagar moletom pa poliéster lista de tecidos',r:['Cadastros › Produtos: o quadro Tecidos fica logo no começo (também está em Cadastros › Ajustes).','Toque no ✎ para mudar o nome ou no × para tirar.','Para ter dois tipos (ex.: Moletom PA e Moletom poliéster): mude o nome de um e adicione o outro. Pedidos que já estão abertos continuam com o nome antigo; corrija neles se precisar.'],ir:'cad:produtos'},
{c:'cad',q:'Como o sistema conta os feriados?',k:'feriado feriados dia útil dias úteis prazo carnaval corpus christi emenda recesso cidade',r:['Feriado não conta como dia útil: os prazos ("faltam 12 dias úteis") e os contadores das máquinas já descontam.','A empresa está em São Paulo, SP: entram os feriados nacionais, o 9 de julho e os municipais (25 de janeiro e Corpus Christi).','Para mudar: Cadastros › Ajustes › Feriados. Lá dá para marcar Carnaval, acrescentar emenda ou recesso, ou tocar em "Vamos trabalhar" num feriado em que a fábrica abre.'],ir:'cad:ajustes#Feriados',g:1},
{c:'arte',q:'Dá para tirar a ficha em preto e branco?',k:'preto e branco colorida colorido cinza tinta economizar',r:['A ficha de produção sai colorida.','Para gastar menos tinta: no PDF de produção, toque em Preto e branco (gasta menos tinta) antes de baixar ou imprimir.']},
{c:'novo',q:'A importação preenche as outras cores da peça?',k:'outras cores cor secundária segunda cor gola punho peitilho detalhe importar',r:['Sim. Se a ficha diz, por exemplo, "AZUL CELESTE com gola, punho e peitilho na cor PRETO", o sistema põe Preta em Outras cores, na gola, nos punhos e no peitilho.','Confira em Outras cores na peça. Se estiver errado, toque no × e acerte depois em ✎ Corrigir pedido.']},
{c:'novo',q:'Dá para importar ficha em Word?',k:'word docx doc ficha word importar arquivo do word',r:['Sim. Em Importar fichas, escolha o arquivo do Word (.docx), do mesmo jeito que o PDF.','A imagem que estiver dentro do Word vira o mockup da peça.','Se o arquivo for .doc (Word antigo), abra no Word e salve como .docx ou PDF.'],ir:'novo'},
{c:'novo',q:'Onde escrevo observações do pedido?',k:'observação observações obs anotação recado pedido ficha produção',r:['No pedido novo: no passo 3 (a data), embaixo, em Observações do pedido.','Na importação: o campo Observações já vem com o que estava escrito na ficha. Dá para mudar.','Num pedido já lançado: ✎ Corrigir pedido, passo 3.','As observações saem na ficha de produção do sistema, no quadro OBSERVAÇÕES.'],ir:'novo'},
{c:'novo',q:'Errei um pedido já lançado. Como corrijo?',k:'corrigir pedido editar alterar mudar errado lançado',r:['Abra o pedido e toque em ✎ Corrigir pedido.','Mude o que precisar nos passos (dados, peças, quantidades, entrega).','No fim aparece "O que vai mudar". Confira e toque em Salvar correção.','Peça que já começou a produção só muda quantidade e personalização.'],ir:'ped'},
{c:'novo',q:'Como mudo só a data de entrega?',k:'data entrega prazo mudar adiar antecipar',r:['Abra o pedido e toque em ✎ Corrigir pedido.','Toque em Próximo até o passo 3, escolha a nova data e siga até Salvar correção.'],ir:'ped'},
{c:'novo',q:'A cor que preciso não está na lista',k:'cor nova não tem cor cadastrar cor',r:['No passo 2 do pedido, embaixo das cores, toque em Nova cor.','Escreva o nome, escolha a cor e toque em Salvar. Ela fica para os próximos pedidos.']},
{c:'novo',q:'O tecido que preciso não está na lista',k:'tecido novo não tem tecido cadastrar tecido',r:['No passo 2 do pedido, em Tecido, toque em Novo tecido.','Escreva o nome e toque em Salvar. Ele fica cadastrado naquela peça.','Na importação, tecido que o produto ainda não tem entra sozinho como tecido novo.']},
{c:'cad',q:'Como coloco um tecido novo num produto?',k:'tecido novo produto cadastrar tecido piquet malha pv dry algodão incluir tecido',r:['Cadastros › Produtos › toque no produto.','Em Tecidos: toque num tecido de outro produto para incluir, ou escreva um novo. Dá para escrever vários separados por vírgula (ex.: Piquet PV, Piquet dry).','Toque em Adicionar.'],ir:'cad:produtos',g:1},
{c:'novo',q:'A peça tem mais de uma cor (gola de outra cor, por exemplo)',k:'duas cores segunda cor gola outra cor detalhe cor',r:['No passo 2, em "Outras cores na peça", toque em Adicionar segunda cor.','Escolha a cor e as partes (Gola, Mangas…).','Toque em Confirmar cor.']},
{c:'novo',q:'Como coloco personalização (bordado, estampa) no pedido?',k:'personalização bordado estampa silk dtf sublimação logo posição',r:['No passo 2, em "Personalização: o quê e onde", toque em Adicionar.','Escolha o tipo, a parte da peça e onde exatamente (peito esquerdo, centro…).','Esquerdo e direito são de quem veste.']},
{c:'novo',q:'Como coloco as quantidades por tamanho?',k:'quantidade tamanhos grade p m g gg infantil adulto',r:['No passo 2, em "Quantidade por tamanho", escolha na lista: adulto, infantil, especiais…','Toque no quadrinho de cada tamanho e digite a quantidade.']},
{c:'novo',q:'Como lanço um tamanho especial (G1, EXG…)?',k:'tamanho especial especiais g1 g2 g3 g4 exg eg pp plus outro tamanho grande',r:['No passo 2, em Quantidade por tamanho, toque em Especiais (PP, EG, EXG, G1 a G4).','Não achou o tamanho? Escreva em "Outro tamanho" (ex.: G5) e toque em Incluir tamanho. Ele fica cadastrado em Especiais.','Na importação, tamanho especial da ficha entra sozinho.','Para mudar a lista ou quanto tecido cada um gasta: Cadastros › Ajustes › Tamanhos.']},
/* arte e documentos */
{c:'arte',q:'Como coloco a arte ou o arquivo de bordado no pedido?',k:'arte arquivo bordado dst pes logo imagem colocar anexar',r:['Abra o pedido, bloco "Arte para quem aplica".','Em cada personalização, toque em Pôr arte (ou Pôr arquivo de bordado).','Escolha uma que já está guardada (Usar este) ou toque em Enviar um arquivo novo.','Os arquivos ficam guardados na empresa para os próximos pedidos.'],ir:'ped'},
{c:'arte',q:'Como reaproveito uma arte de um pedido antigo?',k:'reaproveitar arte antiga mesma arte arquivo guardado',r:['No pedido, toque em Pôr arte: aparece a lista do que já está guardado na empresa.','Toque em Usar este.','Para ver tudo o que a empresa tem: Pedidos › Empresas › toque na empresa › Arquivos da empresa.']},
{c:'arte',q:'Como marco a posição e o tamanho da arte?',k:'posição tamanho arte cm medida onde vai',r:['Abra o pedido, bloco "Arte para quem aplica".','Escolha a Posição e escreva o Tamanho (ex.: 8 × 8 cm). Salva sozinho.']},
{c:'arte',q:'Como marco que a arte foi feita e aprovada?',k:'arte pronta aprovada aprovar cliente preparar arte',r:['Escritório › Artes: "Preparar a arte" → Pronta; "Aprovar a arte com o cliente" → Aprovada.','Ou no pedido, em "Antes de cortar".'],ir:'fab:esc'},
{c:'arte',q:'Como marco que enviei a arte para quem aplica?',k:'enviei enviar arte bordadeira estamparia',r:['Abra o pedido, bloco "Arte para quem aplica", e toque em Enviei.','O botão só libera depois que o cliente aprova a arte.']},
{c:'arte',q:'Como coloco o mockup na peça?',k:'mockup imagem foto peça desenho',r:['Abra o pedido e, em "Peças e etapas", toque em Pôr mockup (ou Usar mockup já guardado).','Ou no + Novo, toque em Importar mockups para vários de uma vez.']},
{c:'arte',q:'Como vejo o mockup grande?',k:'zoom ampliar aumentar ver imagem grande mockup',r:['Toque na imagem da peça.','Use + e −, ou os dois dedos, para aproximar.']},
{c:'arte',q:'Como gero o documento para o cliente aprovar?',k:'documento pedido cliente aprovar pdf orçamento termo',r:['Abra o pedido e toque em Pedido.','Toque em Baixar PDF ou Imprimir e mande para o cliente.','Quando ele aprovar, toque em Cliente aprovou este pedido.'],ir:'ped'},
{c:'arte',q:'Como imprimo as fichas de produção (1ª e 2ª via)?',k:'ficha de produção imprimir pdf via primeira segunda',r:['Abra o pedido e toque em PDF de produção.','Escolha 1ª e 2ª via (ou só 1ª) e se inclui os mockups.','Toque em Baixar PDF ou Imprimir.'],ir:'ped'},

{c:'gestor',q:'Onde vejo o que precisa de atenção agora?',k:'atenção problemas agora alerta gestor painel',r:['Toque em Gestor, aba Agora.','Cada problema tem um link que leva onde resolver.'],ir:'gest:agora',g:1},

const AJ_PARAR=new Set('como faco fazer faz o a os as de do da dos das e eu um uma para pra pro que onde fica ta esta estao no na nos nas em meu minha se ao com por qual quais quando isso aquilo vejo ver sistema app aparece quero queria preciso consigo posso da tem'.split(' '));
const AJ_SIN={apagar:'tirar excluir remover',excluir:'tirar apagar',remover:'tirar apagar',deletar:'tirar apagar excluir',terceirizado:'prestador fora rua fornecedor',terceirizada:'prestador fora rua fornecedor',prestador:'fornecedor fora rua terceirizado',faccao:'prestador fornecedor fora',rua:'fora prestador levar buscar',vias:'fichas mockups separar',ficha:'fichas vias',insumo:'tecidos aviamentos material conferir',insumos:'tecidos aviamentos material conferir',material:'insumos compra',defeito:'conserto problema',retrabalho:'conserto problema',conserto:'defeito problema',etapa:'processo',processo:'etapa',arremate:'acabamento',acabamento:'arremate',backup:'copia seguranca',usuario:'acesso login',funcionaria:'pessoa equipe',funcionario:'pessoa equipe',costureira:'pessoa equipe',operadora:'pessoa',cliente:'empresa',empresa:'cliente',prazo:'entrega data',atrasado:'atrasando atrasos',notificacao:'avisos sino',alerta:'avisos sino atencao',imprimir:'pdf documento',orcamento:'documento pedido cliente',logo:'marca',salario:'hora extra',extra:'hora'};
const ajNorm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ');
const ajToks=t=>ajNorm(t).split(/\s+/).filter(w=>w&&!AJ_PARAR.has(w)).map(w=>w.length>4&&w.endsWith('s')?w.slice(0,-1):w);
let AJ_IDX=null;
function ajIdx(){if(AJ_IDX)return AJ_IDX;AJ_IDX=FAQ.map((f,i)=>({f,i,q:ajToks(f.q),k:ajToks(f.k),r:ajToks(f.r.join(' '))}));return AJ_IDX}
const ajPref=(a,b)=>{let n=0;while(n<a.length&&n<b.length&&a[n]===b[n])n++;return n};
const ajBate=(t,ws)=>ws.some(w=>w===t||(t.length>=4&&w.startsWith(t))||(w.length>=5&&t.startsWith(w))||(t.length>=5&&w.length>=5&&ajPref(t,w)>=Math.max(4,Math.min(t.length,w.length)-1)));
let AJ_DF=null;const ajPeso=t=>{if(!AJ_DF){AJ_DF={};ajIdx().forEach(x=>new Set([...x.q,...x.k,...x.r]).forEach(w=>AJ_DF[w]=(AJ_DF[w]||0)+1))}const n=Object.entries(AJ_DF).filter(([w])=>ajBate(t,[w])).reduce((a,[,c])=>Math.max(a,c),0);return n?Math.log(1+FAQ.length/n):1};
function ajBusca(q){const ts=ajToks(q);if(!ts.length)return[];
  const pesos=ts.map(ajPeso);
  return ajIdx().map(x=>{let sc=0,hit=0,qh=0;ts.forEach((t,ti)=>{const alt=[t,...(AJ_SIN[t]||'').split(' ').filter(Boolean)];let m=0;alt.forEach((a,ai)=>{const w=ai?.6:1;if(ajBate(a,x.q)){m=Math.max(m,3*w)}else if(ajBate(a,x.k))m=Math.max(m,2*w);else if(ajBate(a,x.r))m=Math.max(m,1*w)});if(m)hit++;if(m>=3)qh++;sc+=m*pesos[ti]});
    return {...x,sc:sc+(hit===ts.length?3:0)+2*qh/Math.max(1,x.q.length),hit}}).filter(x=>x.hit&&x.hit>=Math.min(ts.length,Math.ceil(ts.length/2))).sort((a,b)=>b.sc-a.sc||a.i-b.i).slice(0,12)}
function ajItem(f,aberto){const g=ehGestao();return `<details class="faq"${aberto?' open':''}><summary>${esc(f.q)}${f.g?' <span class="faq-g">gestão</span>':''}</summary><ol>${f.r.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${f.g&&!g?'<p class="dica" style="margin:0 0 6px">Isso é feito por quem é da gestão (Helena ou Roger).</p>':f.ir?`<button class="mbtn" data-a="ajIr" data-v="${esc(f.ir)}">${ic('i-seta')}Me leve até lá</button>`:''}</details>`}
function ajRes(){const e=ui.sheet,q=(e.q||'').trim();
  if(q){const R=ajBusca(q);return R.length?`<p class="sub-l" style="margin:4px 0 10px">${R.length===1?'1 resposta':R.length+' respostas'} para “${esc(q)}”</p>${R.map((x,n)=>ajItem(x.f,n===0)).join('')}`
    :`<div class="vazio-box">${ic('i-lupa')}<b>Não achei nada para “${esc(q)}”</b><span>Tente com outras palavras, como “hora extra”, “conserto”, “estoque” ou “corrigir pedido”. Ou escolha um assunto abaixo.</span></div>${ajAssuntos()}`}
  return `<div class="card aj-basico"><h2>O básico, em 5 toques</h2><ol class="aj-5"><li><b>Começar:</b> na Fábrica, toque em <b>Começar</b> no cartão da máquina.</li><li><b>Terminar:</b> toque em <b>Terminou</b>.</li><li><b>Defeito:</b> toque no cartão da máquina e em <b>Deu problema</b>.</li><li><b>Errou?</b> Toque em <b>Desfazer</b> logo depois.</li><li><b>Pedido novo:</b> toque no <b>+ Novo</b>, embaixo.</li></ol></div>${ajAssuntos()}`}
function ajAssuntos(){const e=ui.sheet;return `<h2 class="sec-t">Escolha um assunto</h2><div class="aj-ass">${FAQ_ASSUNTOS.map(([id,n,i])=>{const L=FAQ.filter(f=>f.c===id),ab=e.ab===id;return `<div class="aj-a"><button class="aj-ab" data-a="ajAss" data-v="${id}" aria-expanded="${ab}">${ic(i)}<span><b>${n}</b><span>${L.length} perguntas</span></span><span class="aj-seta">${ab?'−':'+'}</span></button>${ab?`<div class="aj-l">${L.map(f=>ajItem(f,false)).join('')}</div>`:''}</div>`}).join('')}</div>`}
function sAjuda(){const e=ui.sheet;return `${voltar('Fechar')}<h1>Como usar o app</h1><p class="sub-l" style="margin-top:-4px">Escreva sua dúvida do seu jeito, por exemplo “como marco hora extra” ou “onde fica o estoque”.</p>
  <label class="busca-c" style="margin:6px 0 14px">${ic('i-lupa')}<input class="campo busca" id="ajBusca" value="${esc(e.q||'')}" placeholder="Qual é a sua dúvida?" autocomplete="off" aria-label="Qual é a sua dúvida?" enterkeyhint="search"></label>
  <div id="ajRes">${ajRes()}</div>
  <p class="dica" style="margin-top:18px">Não achou? Pergunte para a Helena, e a resposta entra aqui.</p>
  <div class="acoes"><button class="big go" data-a="fechar">Entendi</button></div>`}

const MODOS={sugerido:'Seguiu a sugestão',reserva:'Reservado à mão',fora:'Começou fora da ordem',outro:'Escolheu outro processo',pessoa:'Trocou a pessoa sugerida'};
const MODO_COR={reserva:'#1E5BB8',fora:'#C9352A',outro:'#B5561B',pessoa:'#7A3E9D'};
function barra(v,max,cor){return `<div class="gtrack"><i style="width:${max?Math.max(2,v/max*100):0}%;background:${cor||'var(--blue)'}"></i></div>`}
function gOrg(desde){const L=(state.log||[]).filter(e=>e.ts>=desde);
  const ini=L.filter(e=>e.tipo==='inicio'),man=ini.filter(e=>e.modo!=='sugerido'),pct=ini.length?man.length/ini.length:0;
  const sev=pct>.2?'crit':pct>.1?'warn':'ok',res=L.filter(e=>e.tipo==='reserva').length,tro=L.filter(e=>e.tipo==='troca');
  const cnt=(arr,f)=>{const m={};arr.forEach(e=>{const k=f(e);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const porModo=cnt(man,e=>e.modo),maxM=Math.max(1,...porModo.map(x=>x[1]));
  const porProc=cnt(man,e=>e.prod+' · '+e.step).slice(0,8),maxP=Math.max(1,...porProc.map(x=>x[1]));
  const tipos=[...new Set(ini.map(e=>e.maqTipo))].map(t=>{const a=ini.filter(e=>e.maqTipo===t),m=a.filter(e=>e.modo!=='sugerido').length;return{t,n:a.length,m,p:a.length?m/a.length:0}}).sort((a,b)=>b.p-a.p);
  const porPes=cnt(man,e=>e.op).slice(0,8);
  const dicas=[];porProc.forEach(([k,n])=>{const a=man.filter(e=>e.prod+' · '+e.step===k),top=cnt(a,e=>e.modo)[0];if(n<3)return;const[pr,st]=k.split(' · ');
    if(top[0]==='fora')dicas.push(`<b>${esc(st)}</b> (${esc(pr)}) começou fora da ordem ${top[1]} vezes. Revise no roteiro o que ela precisa antes: talvez ela não dependa de tudo que está marcado.`);
    else if(top[0]==='pessoa')dicas.push(`Em <b>${esc(st)}</b> (${esc(pr)}) a pessoa sugerida foi trocada ${top[1]} vezes. Revise quem faz melhor (★) essa etapa no cadastro da Equipe.`);
    else if(top[0]==='outro')dicas.push(`<b>${esc(st)}</b> (${esc(pr)}) foi escolhida no lugar da sugestão ${top[1]} vezes. Veja se a prioridade ou a data de entrega do pedido está certa.`);
    else dicas.push(`<b>${esc(st)}</b> (${esc(pr)}) foi reservada à mão ${top[1]} vezes. Se é sempre a mesma máquina, pode ser uma regra que falta no sistema.`)});
  tipos.filter(x=>x.n>=4&&x.p>.3).forEach(x=>dicas.push(`Na <b>${esc(tipo(x.t).nome)}</b>, ${Math.round(x.p*100)}% dos inícios foram manuais. Converse com quem opera essa máquina para entender o porquê.`));
  const ativos=state.pedidos.filter(p=>!p.concluido).map(p=>info(p));
  return `${gTempos(desde)}${gConsertos(desde)}
  <div class="card g-alerta u-${sev}"><h2>Seguem o sistema?</h2><div class="g-big"><b>${Math.round(pct*100)}%</b><span>dos inícios de processo foram decididos à mão</span></div>
    <div style="font-size:18px">${sev==='crit'?`<b>Acima de 20%.</b> A regra está sendo contornada com frequência: provavelmente algum roteiro, dependência ou prioridade está errado no cadastro. Veja abaixo onde corrigir.`:sev==='warn'?'<b>Entre 10% e 20%.</b> Aceitável, mas vale olhar os processos que mais aparecem abaixo.':'<b>Abaixo de 10%.</b> A equipe está seguindo o sistema. Os ajustes à mão são exceção.'}</div>
    <div class="dica">${ini.length} inícios · ${man.length} manuais · ${res} reservas · ${tro.length} tarefas de escritório trocadas de pessoa</div></div>
  ${dicas.length?`<div class="card"><h2>O que corrigir no cadastro</h2>${dicas.slice(0,5).map(d=>`<div class="mat">${ic('i-engr')}<div class="dicaG"><span style="font-size:18px;color:var(--ink)">${d}</span></div><span></span></div>`).join('')}</div>`:''}
  <div class="g-grid">
    <div class="card"><h2>Tipos de ajuste manual</h2>${porModo.map(([k,n])=>`<div class="grow"><span>${esc(MODOS[k])}</span>${barra(n,maxM,MODO_COR[k])}<b>${n}</b></div>`).join('')||'<p class="dica">Nenhum ajuste manual no período.</p>'}</div>
    <div class="card"><h2>Por máquina</h2><p class="dica" style="margin:-4px 0 8px">% de inícios manuais em cada tipo de máquina</p>${tipos.map(x=>`<div class="grow"><span>${esc(tipo(x.t).nome)}</span>${barra(x.p,1,x.p>.2?'var(--red)':x.p>.1?'var(--atn)':'var(--go)')}<b>${Math.round(x.p*100)}%</b></div>`).join('')}</div>
    <div class="card"><h2>Processos mais contornados</h2>${porProc.map(([k,n])=>`<div class="grow"><span>${esc(k)}</span>${barra(n,maxP)}<b>${n}</b></div>`).join('')||'<p class="dica">Nada no período.</p>'}</div>
    <div class="card"><h2>Por pessoa na máquina</h2>${porPes.map(([k,n])=>`<div class="grow"><span style="display:flex;gap:8px;align-items:center">${av(k,'s')}${esc(pNome(k)||k)}</span>${barra(n,porPes[0][1])}<b>${n}</b></div>`).join('')||'<p class="dica">Nada no período.</p>'}</div>
  </div>
  <div class="card"><h2>Últimos ajustes manuais</h2><div class="tw"><table class="gt"><thead><tr><th>Quando</th><th>O quê</th><th>Máquina</th><th>Pessoa</th><th>Tipo</th><th>Registrado por</th></tr></thead><tbody>
    ${[...man,...L.filter(e=>e.tipo!=='inicio')].sort((a,b)=>b.ts-a.ts).slice(0,15).map(e=>`<tr><td>${fD(e.ts)} ${pad(new Date(e.ts).getHours())}:${pad(new Date(e.ts).getMinutes())}</td><td>${esc(e.step)}${e.prod?' · '+esc(e.prod):''}<br><small>${esc(e.cli||'')}</small></td><td>${esc(e.maq?(unidade(e.maq)?.nome||e.maq):'Escritório')}</td><td>${e.tipo==='troca'?`${esc(pNome(e.de)||'—')} → ${esc(pNome(e.para)||'sistema')}`:esc(pNome(e.op)||'—')}${e.modo==='pessoa'&&e.sug?`<br><small>sugerida: ${esc(pNome(e.sug))}</small>`:''}</td><td>${e.tipo==='inicio'?esc(MODOS[e.modo]):({reserva:'Reserva feita',pausa:`Pausado (${e.n??'?'} prontas)`,divisao:`Dividido (${e.n??'?'} peças)`,edicao:'Pedido corrigido',troca:'Tarefa trocada',cancelado:'Pedido cancelado',reativado:'Pedido voltou'})[e.tipo]||'Ajuste'}</td><td>${esc(e.por||'')}</td></tr>`).join('')}
  </tbody></table></div><p class="dica">"Registrado por" mostra quem estava usando o aparelho (escolhido tocando no nome, lá em cima).</p></div>
  <p class="dica">Os números deste painel juntam os cliques de todos os aparelhos.</p>`}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const carregaScript=src=>new Promise((ok,er)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>er(new Error('script'));document.head.appendChild(s)});
async function pdfLib(){if(!window.pdfjsWorker)await carregaScript(PDFJS+'pdf.worker.min.js');if(!window.pdfjsLib)await carregaScript(PDFJS+'pdf.min.js');return window.pdfjsLib}
const lerArq=(f,comoTexto)=>new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=er;comoTexto?r.readAsText(f):r.readAsArrayBuffer(f)});
const lerURL=f=>new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=er;r.readAsDataURL(f)});

async function thumbDe(src,ehPdf,N){const im=new Image();if(ehPdf){const pdf=await pdfLib();const d=await pdf.getDocument({data:Uint8Array.from(atob(src.split(',')[1]),c=>c.charCodeAt(0)),isEvalSupported:false}).promise;const pg=await d.getPage(1);const v1=pg.getViewport({scale:1}),vp=pg.getViewport({scale:N/Math.max(v1.width,v1.height)});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:g,viewport:vp}).promise;return c.toDataURL('image/jpeg',.85)}

function gDesde(){const d=ui.gp||7;return d===1?sod(now()).getTime():now()-d*DIA}
function util2(ini,fim,he){if(!ini||fim<=ini)return 0;let t=0;const d=sod(ini);let n=0;while(d.getTime()<=fim&&n++<400){janelasDia(d).forEach(([a,b])=>t+=sobre(ini,fim,a,b));d.setDate(d.getDate()+1)}
  (he||[]).forEach(h=>t+=sobre(h.i,h.f,ini,fim));return t}
const dispPeriodo=(a,b)=>util2(a,b,[]);
function gDados(desde){const T=now(),P=plano(),st={};
  state.pessoas.filter(p=>p.sabe.length).forEach(p=>st[p.id]={p,proc:0,pecas:0,real:0,padrao:0,padEf:0,realEf:0,retr:0,retrMin:0,busy:0,he:0});

      if(r){r.busy+=util2(Math.max(x.ini,desde),Math.min(x.fim||T,T),x.he);(x.he||[]).forEach(h=>r.he+=sobre(h.i,Math.min(h.f,x.fim||T,T),desde,T))}
      if(x.st!=='ok'||!x.fim||x.fim<desde)return;const real=x.util!=null?x.util*MIN:tempoUtil(x),pad=s.min*q*MIN;
      if(r){r.proc++;r.pecas+=q;r.padrao+=pad;r.real+=real;if(real>=MIN){r.padEf+=pad;r.realEf+=real}
        const pp=r.pp=r.pp||{},kk=l.prod+'|'+sid,e=pp[kk]=pp[kk]||{et:s.nome,prod:prod(l.prod).nome,n:0,pecas:0,real:0,pad:0,cons:0};e.n++;e.pecas+=q;e.real+=real;e.pad+=pad;if(l.rework)e.cons++}
      if(real>=MIN&&!l.rework){const k=prod(l.prod).nome+' · '+s.nome;const e=porEt[k]=porEt[k]||{k,n:0,pad:0,real:0,min:s.min,p:l.prod,sid};e.n++;e.pad+=pad;e.real+=real}})})});

    return {...r,ef,ocup:disp?Math.min(1,r.busy/disp):0,pontos:Math.max(0,Math.round((r.padrao*efC-r.retrMin)/MIN))}}).sort((a,b)=>b.pontos-a.pontos||b.pecas-a.pecas);
  return {T,P,rank,disp,porEt:Object.values(porEt)}}
/* Tempo de cada pessoa em cada processo (processos terminados no período; tempo real, sem pausas) */

const pctTxt=x=>x==null?'—':Math.round(x*100)+'%';
function gAlertas(){const T=now(),P=plano(),sit=situacao(),out=[],lim=(prm().parado||20)*MIN,esc_=tarefasEsc();

  if(sit.k==='trab'||Object.values(P.uso).some(t=>heAtiva(t.x)))state.pessoas.filter(p=>p.sabe.length&&p.disp!==false&&!P.ocup.has(p.id)).forEach(p=>{

  const semR=esc_.filter(t=>!t.resp).length;if(semR)A('warn','i-vias',`${semR} ${semR>1?'tarefas':'tarefa'} de escritório sem responsável`,'Ninguém com essa função está disponível.','fab:esc','Atribuir responsáveis');

    <details class="como"><summary>Como os pontos são calculados</summary><p>Cada processo terminado vale o <b>tempo previsto</b> dele (minutos por peça × peças). Assim, fazer muitas peças de um processo difícil vale mais que poucas de um fácil.</p><p>Esse total é multiplicado pela <b>eficiência</b>: tempo previsto ÷ tempo que a pessoa levou de verdade (sem contar pausas). Fazer mais rápido que o previsto aumenta os pontos (até 150%). Mais devagar diminui (até 50%).</p><p>Peças que voltaram para <b>conserto</b> descontam o tempo gasto para refazer.</p><p>Atenção: se o tempo previsto de uma etapa estiver errado no cadastro, a eficiência de quem faz essa etapa fica distorcida. Veja a aba Organização.</p></details></div>

const stab=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,k2)=>(o[k2]=x[k2],o),{}):x);

const semana=ts=>{const d=new Date(ts-3*36e5);d.setUTCHours(0,0,0,0);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)};
const idDoc=(k,it)=>String(k==='consertos'?it.r:it.id).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_');
function paraDocs(st){const m={},cfg={};
  Object.keys(st).forEach(k=>{if(COLS.includes(k))(st[k]||[]).forEach((it,i)=>{m[k+'/'+idDoc(k,it)]={...it,_o:i}});else if(k!=='log')cfg[k]=st[k]});
  m['config/main']=cfg;const b={};(st.log||[]).forEach(e=>{const key=semana(e.ts)+'_'+(e.dv||'x');(b[key]=b[key]||[]).push(e)});
  Object.entries(b).forEach(([k,v])=>m['log/'+k]={items:v});const out={};Object.entries(m).forEach(([p,v])=>out[p]=limpo(v));return out}
function deDocs(m){const cfg=m['config/main']||{};const st=m['config/main']?{...cfg}:{v:8,estoque:{},cores:{...CORES},...CFG0()};if(st.seq==null){const nums=Object.keys(m).filter(k=>k.startsWith('pedidos/')).map(k=>parseInt(k.split('/')[1],10)).filter(n=>!isNaN(n));st.seq=nums.length?Math.max(...nums)+1:1}COLS.forEach(k=>st[k]=[]);st.log=[];
  Object.entries(m).forEach(([p,v])=>{const [c]=p.split('/');if(COLS.includes(c))st[c].push(v);else if(c==='log')st.log.push(...(v.items||[]))});
  COLS.forEach(k=>{st[k].sort((a,b)=>(a._o??0)-(b._o??0));st[k]=st[k].map(({_o,...r})=>r)});st.log.sort((a,b)=>a.ts-b.ts);return st}
function difPatch(a,b){const p={};for(const k of Object.keys(a))if(!(k in b))return null;
  for(const k of Object.keys(b)){const x=a[k],y=b[k];if(stab(x)===stab(y))continue;
    if(x&&y&&typeof x==='object'&&typeof y==='object'&&!Array.isArray(x)&&!Array.isArray(y)){const q=difPatch(x,y);if(q===null)return null;p[k]=q}else p[k]=y}return p}

function nuvemSalvar(){if(NV.modo!=='nuvem')return;const cur=paraDocs(state);const nl={};
  Object.entries(cur).forEach(([p,v])=>{const j=stab(v);nl[p]=j;if(NV.last[p]!==j)NV.Q.add(p)});
  Object.keys(NV.last).forEach(p=>{if(!(p in cur))NV.Q.add(p)});NV.last=nl;nuvemEnviar()}
async function nuvemEnviar(){if(NV.busy||!NV.db||!NV.Q.size)return;NV.busy=true;syncSt('salvando');let falhou=false;
  try{while(NV.Q.size){const p=NV.Q.values().next().value;const cur=paraDocs(state)[p];const ref=NV.db.doc(p);
      try{if(!cur){const [col,idd]=p.split('/');if(col!=='log'&&NV.acked[p]){await NV.db.doc(`lixeira/${col}~${idd}~${Date.now().toString(36)}`).set({col,id:idd,data:NV.acked[p],ts:now(),por:quemNome()||''})}await ref.delete();delete NV.acked[p]}
        else{const old=NV.acked[p];const pt=old?difPatch(old,cur):null;
          if(!old||pt===null)await ref.set(cur);else if(Object.keys(pt).length)await ref.update(pt);NV.acked[p]=cur}
        NV.Q.delete(p)}
      catch(e){const c=e&&e.code;if(c==='invalid_argument'&&NV.acked[p]){delete NV.acked[p];continue}
        if(c==='quota_exceeded'){NV.Q.delete(p);toast('O banco de dados encheu. Avise o Nico.',false);continue}
        if(c==='invalid_argument'&&!p.startsWith('log/')&&stab(cur||{}).length<200000){NV.soLer=true;NV.Q.clear();syncSt('ler');soLeituraVolta();return}
        if(c==='invalid_argument'||c==='revoked'||c==='not_granted'){NV.Q.delete(p);if(c!=='invalid_argument'){NV.pronto=false;NV.erro='sem-db';render()}continue}
        falhou=true;break}}}
  finally{NV.busy=false}
  if(NV.soLer)return;if(falhou){syncSt('off');clearTimeout(NV.timer);NV.timer=setTimeout(nuvemEnviar,6000)}else if(NV.Q.size)nuvemEnviar();else syncSt('ok')}

  snap.docChanges().forEach(ch=>{const p=col+'/'+ch.doc.id;if(NV.Q.has(p))return;
    if(ch.type==='removed'){if(p in NV.last){delete NV.last[p];delete NV.acked[p];mudou=true}return}
    const d=limpo(ch.doc.data()||{});const j=stab(d);NV.acked[p]=d;if(NV.last[p]===j)return;NV.last[p]=j;mudou=true});
  if(!mudou)return;const m={};Object.entries(NV.last).forEach(([p,j])=>m[p]=JSON.parse(j));
  const novo=normalizar(deDocs(m));['atrib'].forEach(k=>{if(!novo[k])novo[k]={}});state=novo;RC={};
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}nuvemRender()}

  const ids=new Set(peds.map(p=>p.id));const ant=JSON.parse(localStorage.getItem('martins-so-aqui')||'null');const junta=(a,b,k)=>{const o=new Map((a||[]).map(x=>[x[k],x]));(b||[]).forEach(x=>o.set(x[k],x));return[...o.values()]};
  const g={ts:now(),pedidos:junta(ant?.pedidos,peds,'id'),lotes:junta(ant?.lotes,velho.lotes.filter(l=>ids.has(l.ped)),'id'),clientes:junta(ant?.clientes,(velho.clientes||[]).filter(c=>peds.some(p=>p.cli===c.id)),'id')};

   Quando a página é aberta com window.MARTINS_SB={url,key} (index.html gerado por tools/build.js), o banco e o login
   passam a ser do Supabase. Sem isso, continua usando o banco do Claude, como antes. */
const SB_CFG=(typeof window!=='undefined'&&window.MARTINS_SB&&window.MARTINS_SB.url)?window.MARTINS_SB:null;
const SB={c:null,user:null,ch:null,ouvintes:{}};
function sbCarrega(){return new Promise((ok,ruim)=>{if(window.supabase?.createClient)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.onload=ok;s.onerror=()=>ruim(new Error('sem supabase'));document.head.appendChild(s)})}
async function sbCliente(){if(SB.c)return SB.c;await sbCarrega();SB.c=window.supabase.createClient(SB_CFG.url,SB_CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return SB.c}
function sbDB(c){const T='docs';
  const dobj=(path,data)=>({id:path.slice(path.indexOf('/')+1),exists:data!=null,data:()=>data==null?undefined:JSON.parse(JSON.stringify(data)),metadata:{}});
  const falha=e=>{throw {code:/42501|row-level|permission/i.test((e&&(e.code+' '+e.message))||'')?'invalid_argument':'unavailable',message:e&&e.message}};
  const doc=path=>({id:path.split('/').pop(),path,
    get:async()=>{const {data,error}=await c.from(T).select('data').eq('path',path).maybeSingle();if(error)falha(error);return dobj(path,data?data.data:null)},
    set:async d=>{const {error}=await c.from(T).upsert({path,data:d});if(error)falha(error)},
    update:async d=>{const {data,error}=await c.rpc('doc_update',{p:path,patch:d});if(error)falha(error);if(!data)throw {code:'invalid_argument',message:'documento não existe'}},
    delete:async()=>{const {error}=await c.from(T).delete().eq('path',path);if(error)falha(error)},
    acquire:async()=>({acquired:true})});
  const lista=async col=>{const out=[];for(let de=0;;de+=500){const {data,error}=await c.from(T).select('path,data').eq('col',col).order('path').range(de,de+499);if(error)falha(error);out.push(...data);if(data.length<500)break}return out};
  const ouvir=()=>{if(SB.ch)return;SB.ch=c.channel('martins-docs').on('postgres_changes',{event:'*',schema:'public',table:T},pl=>{const p=(pl.new&&pl.new.path)||(pl.old&&pl.old.path)||'';const col=p.split('/')[0];(SB.ouvintes[col]||[]).forEach(f=>f());if(!p)Object.values(SB.ouvintes).flat().forEach(f=>f())}).subscribe()};
  const collection=col=>({path:col,doc:id=>doc(col+'/'+id),
    get:async()=>{const r=await lista(col);return {docs:r.map(x=>dobj(x.path,x.data)),size:r.length,empty:!r.length}},
    onSnapshot:(next,onErr)=>{let prev=new Map(),vivo=true,t=null,rodando=false,denovo=false;
      const puxa=async()=>{if(rodando){denovo=true;return}rodando=true;try{const r=await lista(col);const nm=new Map(r.map(x=>[x.path,x.data]));const ch=[];
          nm.forEach((d,p)=>{const o=prev.get(p);if(o===undefined)ch.push({type:'added',doc:dobj(p,d)});else if(JSON.stringify(o)!==JSON.stringify(d))ch.push({type:'modified',doc:dobj(p,d)})});
          prev.forEach((o,p)=>{if(!nm.has(p))ch.push({type:'removed',doc:dobj(p,o)})});prev=nm;if(vivo&&ch.length)next({docs:[...nm].map(([p,d])=>dobj(p,d)),docChanges:()=>ch,metadata:{fromCache:false}})}
        catch(e){onErr&&onErr(e)}finally{rodando=false;if(denovo){denovo=false;puxa()}}};
      const f=()=>{clearTimeout(t);t=setTimeout(puxa,200)};(SB.ouvintes[col]=SB.ouvintes[col]||[]).push(f);ouvir();puxa();
      return ()=>{vivo=false;SB.ouvintes[col]=(SB.ouvintes[col]||[]).filter(x=>x!==f)}}});
  return {doc,collection}}

function vConectando(){const e=NV.erro;if(e==='login')return vLoginSB();if(e==='semacesso')return `<div class="conect"><span class="m-ic">${ic('i-cadeado')}</span><h1>Este e-mail ainda não tem acesso</h1><p>${esc(SB.user?.email||'')} entrou, mas não está na lista de acessos do app. Peça para a Helena ou o Roger cadastrarem em Cadastros › Ajustes › Acessos.</p><button class="big go" data-a="sbSair">Entrar com outro e-mail</button></div>`;const box=(i,t,p,b)=>`<div class="conect"><span class="m-ic">${ic(i)}</span><h1>${t}</h1>${p}${b||''}</div>`;
  if(e==='sem-db')return box('i-alerta','Este aparelho não está ligado à nuvem',`<p>Para não trabalhar com dados diferentes dos outros aparelhos, o app só abre ligado à nuvem da Martins.</p><ol><li>Abra o link no navegador <b>Chrome</b>.</li><li>Entre na <b>conta Claude</b> que recebeu acesso ao app.</li><li>Toque em <b>Tentar de novo</b>.</li></ol><p class="dica">Sem conta ou sem acesso? Fale com o Nico.</p>`,`<button class="big go" data-a="reconectar">Tentar de novo</button>`);
  if(e==='rede')return box('i-alerta','Sem internet',`<p>O app precisa da internet para mostrar os dados certos. Tentando de novo sozinho…</p>`,`<button class="big go" data-a="reconectar">Tentar agora</button>`);
  if(e==='vazio')return box('i-alerta','Não achamos os dados da Martins',`<p>Este acesso só consegue ver e a nuvem veio vazia. Fale com o Nico.</p>`,`<button class="big go" data-a="reconectar">Tentar de novo</button>`);
  return box('i-relogio','Abrindo…',`<p>Buscando os dados na nuvem.</p>`)}
async function nuvemIniciar(modo){const btns=document.querySelectorAll('[data-a=inicio]');btns.forEach(b=>b.disabled=true);
  try{const l=await NV.db.doc('trava/inicio').acquire({holder:DEV,ttlMs:60000});const m=await nuvemLer();
    const temDados=Object.keys(m).some(k=>/^(pedidos|lotes|pessoas|produtos|clientes)\//.test(k));
    if(m['config/main']?.v||temDados||!l.acquired){ui.inicio=false;if(m['config/main']?.v||temDados)return nuvemAdotar(m);return setTimeout(nuvemConectar,3000)}
    if(modo==='vazia'){state.pedidos=[];state.lotes=[];state.consertos=[];state.log=[];state.atrib={};state.exemplo=false}else state.exemplo=true;
    ui.inicio=false;NV.pronto=true;NV.acked={};NV.last={};NV.modo='nuvem';save();render();tick();nuvemOuvir();mockPendentes();toast('Pronto! Os dados agora ficam na nuvem',false)}
  catch(e){btns.forEach(b=>b.disabled=false);toast('Sem conexão. Tente de novo.',false)}}
function vInicio(){return `<div class="inicio"><span class="m-ic" style="width:72px;height:72px">${ic('i-fabrica')}</span><h1>Vamos começar</h1>
  <p>É a primeira vez que o sistema abre na nuvem. As máquinas, a equipe, os produtos e o estoque <b>deste aparelho</b> vão para a nuvem. Escolha como começar:</p>
  <button class="big go" data-a="inicio" data-v="vazia">${ic('i-check')}Começar a usar (sem pedidos de exemplo)</button>
  <button class="big neutro" data-a="inicio" data-v="exemplo">${ic('i-lista')}Treinar com os pedidos de exemplo</button>
  <p class="sub-l">Dá para apagar os pedidos de exemplo depois, em Cadastros › Ajustes.</p></div>`}
const QR_PUB=(()=>{try{const m=location.hash.match(/[#&]f=([0-9a-f]{20,})/);return m?m[1]:null}catch(e){return null}})();
async function buscaFichaPub(tok){if(SB_CFG){const r=await fetch(SB_CFG.url+'/rest/v1/rpc/ficha_publica',{method:'POST',headers:{apikey:SB_CFG.key,Authorization:'Bearer '+SB_CFG.key,'Content-Type':'application/json'},body:JSON.stringify({tok})});if(!r.ok)throw new Error('rede');return await r.json()}
  load();const l=(state.lotes||[]).find(x=>x.qr===tok);if(!l)return null;const m=paraDocs(state);return {docs:m,mock:mockGrande(l)||await pegaMock(l)||null,mockId:mockChave(l)}}
async function fichaPublica(tok){const app=document.getElementById('app');document.body.classList.add('sem-login','pub');app.innerHTML=`<div class="conect"><span class="m-ic">${ic('i-relogio')}</span><h1>Abrindo a ficha…</h1></div>`;
  let r=null;try{r=await buscaFichaPub(tok)}catch(e){app.innerHTML=`<div class="conect"><span class="m-ic">${ic('i-alerta')}</span><h1>Sem internet</h1><p>Confira a conexão e leia o QR code de novo.</p></div>`;return}
  if(!r||!r.docs){app.innerHTML=`<div class="conect"><span class="m-ic">${ic('i-alerta')}</span><h1>Ficha não encontrada</h1><p>Esta etiqueta não vale mais. Peça uma etiqueta nova no escritório.</p></div>`;return}
  try{r.docs['config/main']={...CFG0(),estoque:{},cores:{...CORES},...(r.docs['config/main']||{})};state=deDocs(r.docs);normalizar(state)}catch(e){app.innerHTML=`<div class="conect"><span class="m-ic">${ic('i-alerta')}</span><h1>Não consegui abrir a ficha</h1><p>Tente de novo ou peça a ficha no escritório.</p></div>`;return}
  const l=(state.lotes||[]).find(x=>x.qr===tok);if(!l){app.innerHTML='';return}if(r.mock){MOCKG[(r.mockId||l.id)+'~c']=r.mock}
  const ped=pedById(l.ped),todos=lotesDe(ped.id).filter(x=>!x.rework);ui.sheet={t:'doc',tipo:'prod',id:ped.id,so:l.id,vias:1,mocks:false,pb:false,cinza:{},pub:true};
  const P=paginasDoc(ui.sheet);app.innerHTML=`<div class="pub-f"><div class="pub-h">${logoMarca()}<div><h1>Ficha de produção</h1><p class="sub-l">${esc(ped.cliente)} · pedido ${esc(ped.id)} · peça ${esc(l.id)}${ped.cancelado?' · <b>PEDIDO CANCELADO</b>':''}</p></div></div>
    <div class="acoes" style="margin-top:0"><button class="big go" data-a="docPdf">${ic('i-lista')}Baixar PDF</button><button class="big neutro" data-a="docPrint">Imprimir</button></div>
    <div class="docs">${P.map(h=>`<div class="a4wrap">${h}</div>`).join('')}</div></div>`;ajustaA4();addEventListener('resize',ajustaA4)}
if(QR_PUB)fichaPublica(QR_PUB);else{
load();render();tick();setInterval(tick,30000);nuvemConectar();
try{if(!localStorage.getItem(KEY+'-ajuda')){localStorage.setItem(KEY+'-ajuda','1');openSheet({t:'ajuda'})}}catch(e){}}
</script>
